name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The resolver's own tests need no network and no oracle.
      - run: node --test compat/parity/resolve-oracle.test.mjs compat/parity/report-changes.test.mjs
      # LiteRouter refs/heads/main is resolved once for this job and frozen: every
      # step below reads ORACLE_SHA. A failed resolve fails the job; there is no
      # fallback SHA. Re-run a recorded commit with
      # `node compat/parity/resolve-oracle.mjs --sha <sha>` (#289).
      - name: Resolve and fetch the LiteRouter main oracle into disposable test storage
        run: node compat/parity/resolve-oracle.mjs
      - name: Upload the oracle run record
        uses: actions/upload-artifact@v4
        with:
          name: oracle-run
          path: ${{ env.ORACLE_RECORD }}
      # Compare this run's frozen snapshot with the one the last successful main run
      # recorded (#290). No earlier record is a first run, reported as such; the
      # report is informational (no upstream state fails the job), and nothing is
      # posted or filed from it.
      - name: Fetch the previous recorded oracle snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous="$RUNNER_TEMP/previous-oracle"
          run_id=$(gh run list --workflow ci.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty' || true)
          if [ -n "$run_id" ] && gh run download "$run_id" --name oracle-run --dir "$previous" && [ -f "$previous/oracle-run.json" ]; then
            echo "ORACLE_PREVIOUS=$previous/oracle-run.json" >> "$GITHUB_ENV"
          else
            echo "::notice::No previous oracle-run record is available; the change report will say first-run."
          fi
      - name: Report LiteRouter changes since the previous snapshot
        run: node compat/parity/report-changes.mjs
      - name: Upload the oracle change report
        uses: actions/upload-artifact@v4
        with:
          name: oracle-change-report
          path: ${{ env.ORACLE_REPORT_DIR }}
      - run: node compat/parity/inventory.mjs
      # The oracle's Combo routing (member order, capability detection, adapter pools) is
      # re-run and compared with the pin the Go tests replay (#270).
      - run: node compat/parity/generate-combo-routing.mjs --check
      # The oracle's default price catalog and cost arithmetic, replayed by internal/pricing (#273).
      - run: node compat/parity/generate-pricing.mjs --check
      - run: go test -race ./internal/app -run TestPinnedSystemOneDifferential -count=1
      - run: go test -race ./internal/security ./internal/ingress ./internal/providers/shared ./internal/providers/wire ./internal/protocol/concerns
      - run: go test -race ./internal/parity ./internal/protocol/hub ./internal/pricing -count=1
      # Provider catalog, model seeds, quota readers and onboarding flows are
      # compared against the oracle: no hand-kept provider list can drift.
      - run: go test -tags oracle ./internal/providers/parity -count=1
      # The secret tripwire reads the secrets the oracle ships. Without ORACLE_DIR
      # it can only match known prefixes, which is how the iflow literal shipped, so
      # it runs here where the oracle is present.
      - run: go test ./internal/providers/onboarding -run TestNoThirdPartyProviderSecretInTree -count=1
        env:
          # This job fetches the oracle, so the scan must be the full one; without
          # the oracle it fails rather than degrading to a prefix check.
          ROUTEWEFT_REQUIRE_ORACLE_SECRET_SCAN: "1"

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go test -race ./compat/...
      - run: go vet ./...
      - run: go build ./cmd/routeweft
      - run: go test ./bench/router -run '^$$' -bench . -benchmem -count=1

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t routeweft:ci .
      - run: test "$(docker image inspect routeweft:ci --format '{{.Config.Entrypoint}}')" = '[/routeweft]'
      - name: Verify runtime TLS trust bundle
        run: |
          container_id=$(docker create routeweft:ci)
          trap 'docker rm "$container_id"' EXIT
          docker cp "$container_id:/etc/ssl/certs/ca-certificates.crt" "$RUNNER_TEMP/routeweft-ca.crt"
          test -s "$RUNNER_TEMP/routeweft-ca.crt"
      - name: Enforce production image budget
        run: |
          image_bytes=$(docker image inspect routeweft:ci --format '{{.Size}}')
          echo "Image: ${image_bytes} bytes; goal: 104857600 bytes (100 MiB); stretch: 62914560 bytes (60 MiB)"
          test "$image_bytes" -le 104857600
