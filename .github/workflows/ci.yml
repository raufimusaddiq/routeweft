name: CI

# Pull requests get the two cheap gates only: `go` and `ui`. Everything slower
# lives in main.yml and runs after merge (#361):
#   - parity (oracle generators, ~6 min)  -> main only
#   - race (full tree under -race)        -> main only
#   - container (image build/budget)      -> main only
#   - ui-smoke (Playwright, ~10 min)      -> removed; run `npm run smoke` locally
# A push to a feature branch used to start a second full run beside the PR run;
# it no longer starts anything. Branch protection on main requires `go` and `ui`.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/routeweft

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm test
      # `npm run build` is `tsc --noEmit && vite build`, so typecheck runs here.
      - run: npm run build
