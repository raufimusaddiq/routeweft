<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Routeweft</title>
  <!-- Favicon: the same drawing as mark.svg with literal colours, because a favicon cannot read the page's CSS
       variables. Light tab bars get the light-theme ink, dark tab bars the dark-theme ink. -->
  <style>
    .warp { fill: #111111; }
    .weft { fill: #00727f; }
    @media (prefers-color-scheme: dark) {
      .warp { fill: #f7f6f0; }
      .weft { fill: #4fd1e0; }
    }
  </style>
  <g class="warp">
    <rect x="4" y="2" width="4" height="10"/>
    <rect x="4" y="20" width="4" height="10"/>
    <rect x="14" y="10" width="4" height="12"/>
    <rect x="24" y="2" width="4" height="10"/>
    <rect x="24" y="20" width="4" height="10"/>
  </g>
  <g class="weft">
    <rect x="10" y="4" width="12" height="4"/>
    <rect x="2" y="14" width="10" height="4"/>
    <rect x="20" y="14" width="10" height="4"/>
    <rect x="10" y="24" width="12" height="4"/>
  </g>
</svg>
